name: Publish client review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check JavaScript
        run: npm --prefix preview run check
      - name: Prepare project paths
        run: node preview/scripts/build-pages.mjs
        env:
          PAGES_BASE_PATH: /atoz/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview/pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
